jenkins:
  systemMessage: "Local GitHub → Java 8 → Docker → PostgreSQL → ELK lab"
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "orders-db-app"
              description: "Local PostgreSQL app account"
              username: "loadtest"
              password: "${LAB_DB_PASSWORD}"
jobs:
  - script: |
      pipelineJob('java8-loadtest-ci') {
        description('Polls the GitHub main branch about once per minute, then builds and deploys on local Docker.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${GITHUB_REPO_URL}')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight()
          }
        }
        triggers {
          scm('H/1 * * * *')
        }
      }
